[package]
name = "dbrust"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An approachable terminal SQL workbench"
license = "MIT"
repository = "https://github.com/nhanhoang1405/dbrust"

[dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
chrono = "0.4"
crossterm = "0.29"
directories = "6"
futures-util = "0.3"
percent-encoding = "2"
redis = { version = "0.32.7", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"] }
shell-words = "1"
ratatui = "0.30.2"
ratatui-textarea = "0.9.4"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "mysql", "sqlite", "chrono", "uuid", "json", "rust_decimal"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
unicode-width = "0.2"
url = "2"
uuid = "1"
